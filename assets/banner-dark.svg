<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270" role="img" aria-label="Foresight. Look once, plan once, run it all." font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
<title>Foresight. Look once, plan once, run it all.</title>
<rect x="1" y="1" width="1198" height="268" rx="18" fill="#151b23" stroke="#3d444d"/>
<defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3987e5"/><stop offset="1" stop-color="#6250d6"/></linearGradient></defs><g transform="translate(64,62) scale(1.125)"><rect width="64" height="64" rx="15" fill="url(#lg)"/><path d="M17 19 L30 32 L17 45" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/><path d="M33 19 L46 32 L33 45" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="158" y="118" font-size="62" font-weight="700" fill="#f0f6fc" text-anchor="start" letter-spacing="-1.5">Foresight</text>
