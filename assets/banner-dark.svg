<circle cx="872" cy="86" r="10" fill="#3987e5"/><path d="M867.8 86.2 L871.0 89.4 L876.5 83.0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="894" y="92" font-size="17" font-weight="500" fill="#f0f6fc" text-anchor="start" >Fill "Email"</text>
