<!doctype html><html><head><meta charset="utf-8"><title>Book</title></head><body>
<script>window.__log = []; const log = (x) => window.__log.push(x);</script>
<form onsubmit="return false"><label>Travel date <input id="d"></label>
<button id="go" type="button" onmousedown="document.getElementById('d').value='2026-01-01'" onclick="log('BOOKED for ' + document.getElementById('d').value); document.getElementById('done').textContent='Booked for ' + document.getElementById('d').value">Book</button></form><div id="done"></div>
<label>City <input id="c" value="Boston"></label>
</body></html>
